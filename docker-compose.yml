services:
  app:
    build: .
    ports:
      - "8000:8000"
    network_mode: "host"
    environment:
      - LLM_PROVIDER=ollama
      - OLLAMA_BASE_URL=http://127.0.0.1:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:3b}
      - OLLAMA_EMBEDDING_MODEL=${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      - LLM_TEMPERATURE=0.2
      - LLM_TIMEOUT=300
      - QDRANT_HOST=127.0.0.1
      - QDRANT_PORT=6333
      - QDRANT_COLLECTION=parking_docs
      - POSTGRES_HOST=127.0.0.1
      - POSTGRES_PORT=5432
      - POSTGRES_DB=parking_booking
      - POSTGRES_USER=parking
      - POSTGRES_PASSWORD=parking_secret
      - GUARDRAILS_ENABLED=true
      - MCP_BASE_URL=http://127.0.0.1:8001
      - MCP_API_TOKEN=${MCP_API_TOKEN:-mcp-secret-token}
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      mcp-server:
        condition: service_started
    volumes:
      - ./data:/app/data

  mcp-server:
    build: ./mcp_server
    ports:
      - "8001:8001"
    environment:
      - MCP_API_TOKEN=${MCP_API_TOKEN:-mcp-secret-token}
      - MCP_OUTPUT_FILE=/data/approved_reservations.txt
    volumes:
      - ./storage:/data

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=parking_booking
      - POSTGRES_USER=parking
      - POSTGRES_PASSWORD=parking_secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./data/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./data/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parking -d parking_booking"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  pgdata:
  qdrant_storage:
