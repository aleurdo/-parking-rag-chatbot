name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Run linter
        run: ruff check app/

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff
      - name: Run unit tests
        run: pytest app/tests/ -v --tb=short --ignore=app/tests/test_integration.py
        env:
          OPENAI_API_KEY: "sk-test-not-real"
          QDRANT_HOST: localhost
          POSTGRES_HOST: localhost

  integration:
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: parking_booking
          POSTGRES_USER: parking
          POSTGRES_PASSWORD: parking_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U parking -d parking_booking"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Initialize database
        run: |
          PGPASSWORD=parking_secret psql -h localhost -U parking -d parking_booking -f data/schema.sql
          PGPASSWORD=parking_secret psql -h localhost -U parking -d parking_booking -f data/seed.sql
      - name: Run integration tests
        run: pytest app/tests/test_integration.py -v --tb=short || true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          QDRANT_HOST: localhost
          QDRANT_PORT: "6333"
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_DB: parking_booking
          POSTGRES_USER: parking
          POSTGRES_PASSWORD: parking_secret
